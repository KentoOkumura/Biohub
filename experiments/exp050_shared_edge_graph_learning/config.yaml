reproducibility:
  deterministic_anchor: false
  seed_policy: sha256_42_video_rank_and_seed_42_plus_fold
  stochastic_components:
  - torch_dataloader
  - cuda_inference
  - ilp_tie_selection
  - optuna_tpe
  parallel_rng_policy: fold_local_rng
  feature_sha_policy: input_window_and_float32_content_sha
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    oof_prediction_sha: true
    test_prediction_content_sha: false
    submission_sha: false
notes:
- Fixed public image models and exp043 coordinate head; no parent control retraining.
- Kaggle train graph evaluation is conditional on public image model training lineage.
- Competition submission requires separate explicit user approval.
