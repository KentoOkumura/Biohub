experiment:
  name: exp053_x138_postlink_division_score
  description: "exp043の再接続後に4時点の接続情報で第2娘を採点して追加する"
  route: public_x138_postlink_division_score
  created_at: "2026-09-29"
  notebooks: [train, inference]

lineage:
  parent: exp043_x138_self_trained_head
  hypothesis_id: HYP-20260910-03
  backlog_candidate: x138_division_branch_graph
  diff_summary: "全動画ILPではなく完成直前のgraphで4時点の分裂候補を線形採点する"

source:
  baseline_experiment: exp043_x138_self_trained_head
  baseline_public_lb: 0.950
  baseline_coordinate_head_sha256: 32d6c62f738c3dfe4862e3df5272850312e81b622e57d9ba45209ebb382824dc

data:
  source: competition_train_runtime
  train_geff: train/*.geff
  expected_embryos: [44b6, 6bba]
  selection_seed: 42
  outer_rank_start: 21
  outer_rank_end: 30
  inner_rank_start: 31
  inner_rank_end: 35
  native_spacing_zyx_um: [1.625, 0.40625, 0.40625]
  candidate_parent_max_um: 9.0
  candidate_sister_max_um: 14.0
  existing_child_max_um: 10.0
  max_negative_candidates_per_mother: 8

model:
  name: four_frame_postlink_division_logistic
  params:
    active_variants: [four_frame, context_masked]
    estimator: logistic_regression
    regularization_c: 1.0
    class_weight: balanced
    max_iter: 1000
    seed: 42
    threshold_metric: f_beta_0_5
    threshold_min_precision: 0.8
    frame_fraction_cap: 0.0076
    global_fraction_cap: 0.00375
    tie_break: node_id

validation:
  method: fixed_video_hash_rank_conditional
  outer_videos_per_embryo: 10
  inner_videos_per_embryo: 5
  baseline: exp043_public_lb_0_950
  report_by_embryo: true
  official_metric: adjusted_edge_jaccard_plus_0_1_division_jaccard
  public_lb_is_main_submission_comparison: true
  context_masked_is_train_side_control: true

runtime:
  use_amp: false
  num_workers: 2
  batch_size: 1
  notebook_hours_limit: 12
  colab:
    mode: cli
    use_drive: false
    accelerator: cpu
    input_artifact: division_training_table.npz
    output_artifact: division_model.json
  kaggle:
    train:
      enable_gpu: false
      enable_internet: false
      include_experiment_sources: true
      dataset_sources:
        - pilkwang/biohub-tracking-support-pack-50ep-v1
    inference:
      enable_gpu: true
      enable_internet: false
      machine_shape: NvidiaTeslaT4
      include_experiment_sources: true
      bootstrap_files: [assets/division_model.json]
      dataset_sources:
        - pilkwang/biohub-tracking-support-pack-50ep-v1
        - pilkwang/biohub-temporal-unet3d-seed314159-v1
        - pilkwang/biohub-deepcenter-unet3d-center-prior-v1
        - kentookumura/exp043-self-trained-coordinate-head

reproducibility:
  deterministic_anchor: false
  seed_policy: stable_sha256_42_video_rank_and_fixed_model_seed
  stochastic_components: [baseline_cuda_inference, baseline_ilp]
  parallel_rng_policy: no_randomness_in_inference_division_scoring
  feature_sha_policy: ordered_float32_feature_content_sha
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    oof_prediction_sha: true
    test_prediction_content_sha: true
    submission_sha: true

notes:
  - "4時点の第2娘採点は元の全動画ILP共同選択の省略版。共同選択の効果を主張しない。"
  - "公開画像モデルとexp043 headのtrain来歴があり、動画分割は独立CVではない。"
  - "competition submissionは2026-09-29のユーザー依頼で承認済み。"
