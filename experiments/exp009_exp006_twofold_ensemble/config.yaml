experiment:
  name: exp009_exp006_twofold_ensemble
  description: Reuse the two exp006 embryo-held-out fold models and average detection and edge probabilities before a single threshold and ILP decode for hidden-test submission.
  route: temporal_unet3d_twofold_probability_ensemble
  created_at: '2026-09-12'
lineage:
  parent: exp006_embryo_holdout_seed314159
  hypothesis_id: N/A
  backlog_candidate: N/A
  diff_summary: Reuse both exp006 fold checkpoints without retraining; average per-voxel detection probabilities, extract one shared node set, average both models' edge probabilities on that node set, and decode once.
source:
  repository: https://github.com/royerlab/kaggle-cell-tracking-competition
  commit: 075fc5f5a52d11077f9dc2b074644618f26939e2
  manifest: official_source/SOURCE.json
  license: BSD-3-Clause
overrides:
  project_defaults:
  - validation.metric
  - validation.n_folds
  - validation.strategy
  - validation.seed
  - reproducibility.seed
validation:
  strategy: code_submission_hidden_test
  seed: 314159
  outer_folds:
  - fold: 0
    train_embryo: 44b6
    evaluation_embryo: 6bba
    expected_gradient_update_count: 64
    expected_checkpoint_selection_count: 7
    expected_evaluation_count: 128
  - fold: 1
    train_embryo: 6bba
    evaluation_embryo: 44b6
    expected_gradient_update_count: 116
    expected_checkpoint_selection_count: 12
    expected_evaluation_count: 71
  internal_split_seed: 0
  internal_selection_fraction: 0.1
  n_folds: 2
  expected_sample_count: 199
  expected_embryo_counts:
    44b6: 71
    6bba: 128
  checkpoint_selection_metric: edge_accuracy_times_node_recall
  primary_metric: official_adjusted_edge_jaccard_plus_0.1_division_jaccard
  max_matching_distance_um: 7.0
  diagnostic_only: true
  metric: official_adjusted_edge_jaccard_plus_0.1_division_jaccard
  comparison_experiment: exp006_embryo_holdout_seed314159
data:
  split_manifest_source: ../exp005_embryo_holdout_batch8/artifacts/splits.json
  expected_frames_per_sample: 100
  expected_image_shape:
  - 100
  - 64
  - 256
  - 256
  require_geff_for_train: false
  test_discovery: dynamic_zarr_enumeration
model:
  name: TemporalUNet3D_SimpleNodeTransformer
  params:
    in_channels: 1
    unet_out_channels: 32
    unet_layers:
    - 32
    - 64
    - 128
    gradient_checkpointing: true
    skip_fullres_temporal: true
    window_size: 2
    downsample:
    - 1
    - 4
    - 4
  training:
    seed: 314159
    initialization: random
    upstream_checkpoint: null
    epochs: 3
    optimizer: AdamW
    learning_rate: 0.0001
    batch_size: 8
    num_workers: 8
    det_loss_weight: 1.0
    det_neg_weight: 0.01
    pool_kernel_um: 5.0
    augmentations:
    - brightness_augment
    - flip_augment
    checkpoint_selection: edge_accuracy_times_node_recall
    data_parallel: true
  smoke:
    debug_video: first_sorted_gradient_update_sample_per_outer_fold
    epochs: 1
    max_iters: 2
    runtime_gate_hours: 9
    runtime_projection_multiplier: 1.25
    runtime_gate_scope: all_outer_folds
  inference:
    det_threshold: 0.99
    det_tta: true
    pool_kernel_um: 3.0
    edge_activation: softmax
    edge_threshold: 0.5
    use_ilp: true
    ilp_edge_weight: -1.0
    ilp_appearance_weight: 0.1
    ilp_disappearance_weight: 0.1
    ilp_division_weight: 1.0
    unet_batch_size: 4
    ensemble:
      folds: [0, 1]
      detection_probability: arithmetic_mean
      detection_peak_extraction: after_probability_mean
      edge_probability: arithmetic_mean_on_shared_candidates
      decode_count: 1
      device_by_fold:
        0: cuda:0
        1: cuda:1
runtime:
  use_amp: true
  num_workers: 8
  batch_size: 8
  expected_cuda_device_count: 2
  expected_gpu_name_substring: T4
  notebook_time_limit_hours: 12
  environment:
    PYTORCH_ALLOC_CONF: expandable_segments:True
  kaggle:
    enable_gpu: true
    enable_internet: false
    machine_shape: NvidiaTeslaT4
    time_limit_hours: 12
    dataset_sources:
    - thibautgoldsborough/cellmot-baseline-artifacts
    inference:
      kernel_sources:
      - kentookumura/exp006-embryo-holdout-seed314159-train
    bootstrap_files:
    - official_source/SOURCE.json
    - official_source/LICENSE
    - official_source/scripts/augmentations.py
    - official_source/scripts/dataspec.py
    - official_source/scripts/evaluate.py
    - official_source/scripts/train_unet_transformer.py
    - official_source/scripts/predict_unet_transformer.py
    - official_source/src/tracking_cellmot/__init__.py
    - official_source/src/tracking_cellmot/io.py
    - official_source/src/tracking_cellmot/img_proc.py
    - official_source/src/tracking_cellmot/metrics.py
    - official_source/src/tracking_cellmot/division_metrics.py
    - official_source/src/tracking_cellmot/models/__init__.py
    - official_source/src/tracking_cellmot/models/temporal_unet.py
    - official_source/src/tracking_cellmot/models/simple_node_transformer.py
reproducibility:
  deterministic_anchor: false
  seed: 314159
  seed_policy: saved_exp006_checkpoints_and_deterministic_inference_order
  stochastic_components:
  - cuda_kernels
  parallel_rng_policy: Inference consumes no random numbers; fold 0 is fixed to cuda:0 and fold 1 to cuda:1, with sorted test and window traversal.
  feature_sha_policy: SHA-256 of submission.csv and the canonical JSON inference summary.
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: false
    feature_content_sha: false
    model_manifest_sha: true
    oof_prediction_sha: false
    test_prediction_content_sha: true
    submission_sha: true
  notes:
  - This experiment reuses saved exp006 checkpoints and does not retrain either fold.
  - A separate successor experiment will test byte-identical reruns; this submission run alone is not a deterministic anchor.
notes:
- The public checkpoint bundled in the dependency dataset is never copied or loaded.
- Both exp006 fold checkpoints are required and their recorded SHA-256 values are verified.
- Hidden test datasets are discovered dynamically and submission.csv is built from every generated graph.
- No model training, threshold tuning, fold routing, or finished-graph union is performed.
