experiment:
  name: exp033_frame_self_attention_diagnostics
  description: 保存済み4構成のpair確率と条件別誤りを同じ固定windowで比較する
  route: frozen_feature_primary_tracker_diagnostic
  notebooks: [diagnostic]
  created_at: '2026-09-21'
lineage:
  parent: exp025_frame_self_attention
  hypothesis_id: HYP-20260920-02
  backlog_candidate: frame_self_attention_diagnostics
  diff_summary: exp025 A/B/恒等初期化Bとexp016現行のPR曲線・条件別誤りを追加学習なしで比較
validation:
  strategy: leave_one_embryo_out_conditional_diagnostic
  seed: 42
  n_folds: 2
  internal_split_seed: 0
  internal_selection_fraction: 0.1
  outer_folds:
    - {fold: 0, train_embryo: 44b6, evaluation_embryo: 6bba, expected_train_sample_count: 64, expected_internal_validation_sample_count: 7, expected_evaluation_sample_count: 128}
    - {fold: 1, train_embryo: 6bba, evaluation_embryo: 44b6, expected_train_sample_count: 116, expected_internal_validation_sample_count: 12, expected_evaluation_sample_count: 71}
  benchmark_reference_metrics: experiments/exp025_frame_self_attention/metrics.json
  target_precision: 0.95
  tie_policy: include_all_pairs_with_equal_float32_score
  threshold_for_legacy_reproduction: 0.5
  threshold_comparator: strict_greater_than
  pair_population: legacy_active_pair_mask
  sensitivity_population: active_pairs_with_both_endpoints_matched
  quantiles_from: gradient_update_windows_per_fold
  quantile_points: [0.25, 0.5, 0.75]
  min_positive_edges_per_bucket: 30
  min_division_parents_for_ratio: 10
