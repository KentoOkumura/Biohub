- x138作者の追加checkpointは未取得。作者のscoreや重みの再現を主張しない。
- 予測候補に対応しない疎なGEFF注釈は負例にしない。
- 以前のexp038のcacheと評価値を対照に使わない。exp043からの同一cacheで対照を再測定する。
- ユーザーは週次quotaリセット後のKaggle学習を指定。competition submissionは別途明示承認が必要。
