reproducibility:
  deterministic_anchor: false
  seed: 42
  seed_policy: no_explicit_random_sampling
  stochastic_components:
    - scip_solver_tie_resolution
  parallel_rng_policy: independent_alpha_kernels_each_with_sequential_sorted_samples
  feature_sha_policy: canonical_candidate_graph_nodes_edges_and_edge_prob
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    oof_prediction_sha: false
    test_prediction_content_sha: false
    submission_sha: false
  notes:
    - exp015のmanifest fileとpayload SHA、候補graph内容SHA、公式評価source SHAを検査する。
    - solver package版とILPSolver source SHA、各alphaのsolution topology SHAを実行時に保存する。
    - 公開モデルはtrain 199動画を含む可能性があり、結果は固定公開モデル下の条件付き比較である。

notes:
  - model config 0、fold学習0、booster 0、control再学習なし。
  - 初段はILPだけを比較し、motion、gap、safe-division、DeepCenter repairを実行しない。
  - 両方向のgateを通るまで同じ実験内のfull repair段階を実装・実行しない。
  - Kaggle submissionとPublic LB取得は行わない。

overrides:
  project_defaults:
    - validation.metric
    - validation.n_folds
