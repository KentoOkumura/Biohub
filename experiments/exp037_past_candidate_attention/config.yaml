experiment:
  name: exp037_past_candidate_attention
  description: >-
    exp015の固定候補と画像特徴を使い、中央の各接続候補に対して直前時点の
    全検出候補との3点座標関係をattentionで集約し、exp016の保存済み基準と比較する
  route: frozen_feature_past_candidate_attention
  notebooks:
  - train
  created_at: '2026-09-22'
lineage:
  parent: exp016_frozen_image_encoder
  hypothesis_id: HYP-20260910-10
  backlog_candidate: past_candidate_attention
  diff_summary: >-
    固定画像特徴、候補、教師、loss、外側胚分割を維持し、直前時点の全候補との
    13次元座標関係を32次元MLPとattentionで集約したdelta logitを追加する
validation:
  strategy: leave_one_embryo_out
  seed: 42
  n_folds: 2
  group_key: embryo_id_from_sample_prefix
  outer_folds:
  - fold: 0
    train_embryo: 44b6
    evaluation_embryo: 6bba
    expected_train_sample_count: 64
    expected_internal_validation_sample_count: 7
    expected_evaluation_sample_count: 128
  - fold: 1
    train_embryo: 6bba
    evaluation_embryo: 44b6
    expected_train_sample_count: 116
    expected_internal_validation_sample_count: 12
    expected_evaluation_sample_count: 71
  internal_split_seed: 0
  internal_selection_fraction: 0.1
  checkpoint_selection_metric: edge_accuracy_times_candidate_node_recall
  primary_metric: official_adjusted_edge_jaccard_plus_0.1_division_jaccard
  train_stage_metrics:
  - legacy_mask_loss
  - edge_accuracy
  - positive_edge_recall
  - division_parent_recall
  - candidate_node_recall
  conditional_validation: 公開画像encoderと初期trackerの学習来歴にtrain 199動画が含まれるため、trackerの外側胚分割を独立CVとは呼ばない
  graph_progression_gate:
    threshold: 0.5
    require_positive_edge_recall_improvement_in_each_embryo: true
    max_false_positive_active_pair_relative_increase: 0.05
    require_division_recovered_count_non_decrease: true
    baseline: exp016_saved_fold_models
data:
  source: exp015_train_window_cache_and_competition_geff
  cache:
    kernel_source: kentookumura/exp015-oracle-stage-limits-inference
    summary_file: window_cache_summary.json
    summary_sha256: 040d1f6437e27149e0e34ad4aac8bba3c8cf63dc266d33df497acd969972194c
    identity_sha256: 440891c4550adf8540e3c47f9784e68b6ca1b64bbe56dbb93a25eb87c46bc1ee
    directory: window_cache
    schema_version: 1
    expected_dataset_count: 199
    expected_window_count: 19701
    feature_channels: 32
    primary_feature_contract: 8_view_d4_inverse_aligned_mean_at_detected_candidates
    arrays:
    - candidate_ids_src
    - candidate_ids_tgt
    - coords_src_grid
    - coords_tgt_grid
    - coords_src_physical
    - coords_tgt_physical
    - position_features_src
    - position_features_tgt
    - candidate_mask_src
    - candidate_mask_tgt
    - primary_features_src
    - primary_features_tgt
  annotation:
    source: competition_train_geff
    voxel_scale_zyx_um:
    - 1.625
    - 0.40625
    - 0.40625
  expected_frames_per_sample: 100
  expected_embryo_counts:
    44b6: 71
    6bba: 128
model:
  name: PastCandidateAttentionTracker
  public_source:
    dataset_ref: pilkwang/biohub-tracking-support-pack-50ep-v1
    train_script: repo/scripts/train_unet_transformer.py
    train_script_sha256: c4f6317736bb3bb1ec8f3f6e9a6d935a463e3f0f1f685481b2d13218d35dc9ea
    model_source: repo/src/biohub_tracking/models/simple_node_transformer.py
    model_source_sha256: b97209edeb03840e80d903e3e2a8c81c520641c8ef343f6ca2904d0f80db064e
    checkpoint: weights/unet_transformer/split_0/edge_predictor_best.pth
    checkpoint_sha256: 12f6881ee3620a831697ca098ff8f48e687a24225f4e048b538deec3562fe771
  frozen_components:
  - primary_TemporalUNet3D
  - primary_detection_head
  - secondary_TemporalUNet3D
  - secondary_SimpleNodeTransformer
  - DeepCenter
  - image_normalization_statistics
  - detector_candidates
  - decode_and_graph_repair
  trainable_components:
  - primary_SimpleNodeTransformer
  - past_candidate_attention_branch
  params:
    image_feature_dim: 32
    position_feature_dim: 32
    feature_dim: 64
    hidden_dim: 128
    n_heads: 4
    n_blocks: 4
    dropout: 0.3
    pair_chunk_size: 32
    model_coordinate_units: original_voxel_zyx
    downsample_zyx:
    - 1
    - 4
    - 4
  past_candidate_attention:
    feature_dim: 13
    hidden_dim: 32
    source_chunk_size: 32
    target_chunk_size: 32
    past_candidate_chunk_size: 32
    gradient_checkpointing: true
    vector_scale_um: 5.0
    clip_features: false
    cosine_epsilon: 1.0e-8
    use_no_past_option: true
    no_past_score_initial_value: 0.0
    no_past_feature: zeros
    delta_output_bias: false
    delta_output_zero_initialized: true
    expected_added_parameter_count: 1570
    candidate_scope: all_valid_candidates_from_immediately_previous_frame
  teacher:
    matching: greedy_distance_order_one_to_one
    max_matching_distance_um: 5.0
    target: annotated_adjacent_frame_geff_edges
    unmatched_candidate_label: unknown_but_legacy_mask_can_include_as_negative
  loss:
    edge_activation: source_axis_softmax
    function: focal_weighted_binary_cross_entropy
    focal_gamma: 2.0
    mask: pair_touches_source_or_target_with_positive_annotated_edge
    division_weight: 1.0
    detection_loss: disabled
  training:
    active_variants:
    - past_candidate_attention
    initialization: public_primary_tracker_checkpoint
    seed: 42
    epochs: 3
    optimizer: AdamW
    learning_rate: 0.0001
    weight_decay: 0.01
    batch_size: 2
    num_workers: 2
    gradient_clip_norm: 1.0
    augmentations: []
    mixed_precision: false
    benchmark_windows_per_fold: 64
    benchmark_largest_windows: 2
    runtime_projection_multiplier: 1.5
    runtime_gate_hours: 12.0
    weekly_gpu_budget_hours: 30.0
  control:
    source: exp016_frozen_image_encoder_saved_fold_models_and_metrics
    retrain: false
    evaluate_same_outer_windows: true
    kernel_source: kentookumura/exp016-frozen-image-encoder-train
    manifest_file: model_manifest.json
    manifest_sha256: 6f9548739ae6f58d3c8beb7ccb78464ddc10243841b1fc7e071ed876f757ea56
    experiment: exp016_frozen_image_encoder
    models:
    - fold: 0
      evaluation_embryo: 6bba
      path: models/fold_0/primary_tracker_best.pth
      file_sha256: c775ddabc2df623b08c39e548bebc887a73e790cc89bd9a9e1cb2c3506eff9d2
      canonical_state_sha256: b080c8dc374454f0f97403ec1e27388ef9a5a76c4c658b0ccaeb247ab136ab6c
    - fold: 1
      evaluation_embryo: 44b6
      path: models/fold_1/primary_tracker_best.pth
      file_sha256: ef8b60dc1a34e336942f9abaefdd47606a457e0f569363434619992980d0c5e9
      canonical_state_sha256: 41b03b82d30e9b22d73df6924a70d56ca2b292bb3c41b2678acb5d33990fb3ea
  output:
    model_count: 2
    model_dir: models
    model_manifest: model_manifest.json
    training_summary: training_summary.json
  inference:
    implemented: false
    blocked_by: validation.graph_progression_gate
    mode: pending_pair_diagnostic
    official_metric_computed: false
    active_variants: []
    retrain_models: 0
    submission_created: false
runtime:
  execution: cached_feature_tracker_train_and_pair_diagnostic
  use_amp: false
  num_workers: 2
  batch_size: 2
  kaggle:
    enable_gpu: true
    enable_internet: false
    machine_shape: NvidiaTeslaT4
    time_limit_hours: 12
    include_experiment_sources: true
    dataset_sources:
    - pilkwang/biohub-tracking-support-pack-50ep-v1
    train:
      kernel_id: kentookumura/exp037-past-candidate-attention-train
      enable_gpu: true
      enable_internet: false
      machine_shape: NvidiaTeslaT4
      kernel_sources:
      - kentookumura/exp015-oracle-stage-limits-inference
      - kentookumura/exp016-frozen-image-encoder-train
reproducibility:
  deterministic_anchor: false
  seed: 42
  seed_policy: fixed_global_seed_plus_fold_offset_and_seeded_dataloader_generator
  stochastic_components:
  - dataloader_shuffle
  - transformer_dropout
  - cuda_kernels
  parallel_rng_policy: DataLoader order uses a fold-specific torch.Generator and workers receive deterministic seeds; cache content has no augmentation
  feature_sha_policy: exp015_sorted_window_cache_identity_and_each_previous_window_content_sha
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    oof_prediction_sha: true
    test_prediction_content_sha: false
    submission_sha: false
  notes:
  - 公開画像encoderと初期trackerの学習来歴にtrain 199動画が含まれるためdeterministic anchorまたは独立CVとは扱わない。
  - GPUのbitwise一致は主張せず、入力・特徴・model・予測SHAと数値を記録する。
notes:
- trainはactive variant 1、外側2fold、各3 epoch、学習model 2、booster 0。
- exp016 control、画像encoder、検出head、secondary trackerは再学習しない。
- 予測履歴model、正解履歴、過去画像特徴、候補の近傍制限は使わない。
- 全graph inferenceは隣接pair診断gateを通過し、ユーザーが進行を承認した場合だけ同じ実験へ追加する。
- Kaggle submissionは行わない。
