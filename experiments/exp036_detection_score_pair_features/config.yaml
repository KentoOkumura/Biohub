experiment:
  name: exp036_detection_score_pair_features
  description: >-
    exp015の固定cacheにある検出得点からcandidate pair特徴を作り、
    exp016のprimary tracker接続logitへ学習可能な残差を加える
  route: detection_score_pair_tracker
  notebooks:
    - train
  created_at: "2026-09-22"

lineage:
  parent: exp016_frozen_image_encoder
  hypothesis_id: HYP-20260920-03
  backlog_candidate: detection_score_features
  diff_summary: >-
    検出得点を学習胚だけでlogit標準化し、source、target、小さい方、
    絶対差の4 pair特徴からprimary接続logitへの残差を学習する

validation:
  strategy: leave_one_embryo_out
  seed: 42
  n_folds: 2
  group_key: embryo_id_from_sample_prefix
  outer_folds:
    - fold: 0
      train_embryo: 44b6
      evaluation_embryo: 6bba
      expected_train_sample_count: 64
      expected_internal_validation_sample_count: 7
      expected_evaluation_sample_count: 128
    - fold: 1
      train_embryo: 6bba
      evaluation_embryo: 44b6
      expected_train_sample_count: 116
      expected_internal_validation_sample_count: 12
      expected_evaluation_sample_count: 71
  internal_split_seed: 0
  internal_selection_fraction: 0.1
  checkpoint_selection_metric: edge_accuracy_times_candidate_node_recall
  primary_metric: official_adjusted_edge_jaccard_plus_0.1_division_jaccard
  train_stage_metrics:
    - legacy_mask_loss
    - edge_accuracy
    - positive_edge_recall
    - division_parent_recall
    - candidate_node_recall
  pair_diagnostics:
    score_bin_edges: [0.0, 0.9, 0.95, 0.97, 0.99, 0.995, 1.0]
    score_for_pair_bin: minimum_endpoint_detection_score
    report_counts: true
  progression_gate:
    compare: detection_score_pair_residual_minus_neutral_score_control
    require_each_outer_fold: true
    minimum_positive_edge_recall_delta: 0.0
    minimum_edge_accuracy_delta: 0.0
    minimum_division_parent_recall_delta: 0.0
    require_positive_edge_count: true
    require_division_parent_count: true
    on_failure: stop_before_full_graph_inference
  conditional_validation: >-
    公開画像encoderと初期trackerの学習来歴にtrain 199動画が含まれるため、
    trackerの外側胚分割を独立CVとは呼ばない

data:
  source: exp015_train_window_cache_and_competition_geff
  cache:
    kernel_source: kentookumura/exp015-oracle-stage-limits-inference
    summary_file: window_cache_summary.json
    summary_sha256: 040d1f6437e27149e0e34ad4aac8bba3c8cf63dc266d33df497acd969972194c
    identity_sha256: 440891c4550adf8540e3c47f9784e68b6ca1b64bbe56dbb93a25eb87c46bc1ee
    directory: window_cache
    schema_version: 1
    expected_dataset_count: 199
    expected_window_count: 19701
    feature_channels: 32
    primary_feature_contract: 8_view_d4_inverse_aligned_mean_at_detected_candidates
    arrays:
      - candidate_ids_src
      - candidate_ids_tgt
      - coords_src_grid
      - coords_tgt_grid
      - coords_src_physical
      - coords_tgt_physical
      - detection_scores_src
      - detection_scores_tgt
      - position_features_src
      - position_features_tgt
      - candidate_mask_src
      - candidate_mask_tgt
      - primary_features_src
      - primary_features_tgt
      - secondary_features_src
      - secondary_features_tgt
  annotation:
    source: competition_train_geff
    voxel_scale_zyx_um: [1.625, 0.40625, 0.40625]
  expected_frames_per_sample: 100
  expected_embryo_counts:
    44b6: 71
    6bba: 128

model:
  name: SimpleNodeTransformerWithDetectionScorePairResidual
  public_source:
    dataset_ref: pilkwang/biohub-tracking-support-pack-50ep-v1
    train_script: repo/scripts/train_unet_transformer.py
    train_script_sha256: c4f6317736bb3bb1ec8f3f6e9a6d935a463e3f0f1f685481b2d13218d35dc9ea
    model_source: repo/src/biohub_tracking/models/simple_node_transformer.py
    model_source_sha256: b97209edeb03840e80d903e3e2a8c81c520641c8ef343f6ca2904d0f80db064e
    checkpoint: weights/unet_transformer/split_0/edge_predictor_best.pth
    checkpoint_sha256: 12f6881ee3620a831697ca098ff8f48e687a24225f4e048b538deec3562fe771
  frozen_components:
    - primary_TemporalUNet3D
    - primary_detection_head
    - secondary_TemporalUNet3D
    - secondary_SimpleNodeTransformer
    - DeepCenter
    - image_normalization_statistics
    - detector_candidates
    - decode_and_graph_repair
  trainable_components:
    - primary_SimpleNodeTransformer
    - detection_score_pair_head
  params:
    image_feature_dim: 32
    position_feature_dim: 32
    feature_dim: 64
    hidden_dim: 128
    n_heads: 4
    n_blocks: 4
    dropout: 0.3
    pair_chunk_size: 32
    model_coordinate_units: original_voxel_zyx
    downsample_zyx: [1, 4, 4]
  detection_score:
    source_arrays: [detection_scores_src, detection_scores_tgt]
    transform: clipped_logit_then_fold_standardization
    clip_epsilon: 0.0001
    standardization_scope: gradient_update_candidates_only
    standard_deviation_floor: 0.000001
    pair_features:
      - standardized_source_logit
      - standardized_target_logit
      - minimum_standardized_endpoint_logit
      - absolute_standardized_logit_difference
    pair_feature_dim: 4
    head_hidden_dim: 16
    activation: SiLU
    output_layer_initialization: zeros
    residual_target: primary_connection_logit
  teacher:
    matching: greedy_distance_order_one_to_one
    max_matching_distance_um: 5.0
    target: annotated_adjacent_frame_geff_edges
    unmatched_candidate_label: unknown_but_legacy_mask_can_include_as_negative
  loss:
    edge_activation: source_axis_softmax
    function: focal_weighted_binary_cross_entropy
    focal_gamma: 2.0
    mask: pair_touches_source_or_target_with_positive_annotated_edge
    division_weight: 1.0
    detection_loss: disabled
  feature_ablation:
    active_variants:
      - neutral_score_control
      - detection_score_pair_residual
    neutral_score_control:
      use_detection_score_values: false
      replacement_after_standardization: 0.0
    detection_score_pair_residual:
      use_detection_score_values: true
  training:
    active_modes:
      - neutral_score_control
      - detection_score_pair_residual
    initialization: public_primary_tracker_plus_zero_output_pair_head
    seed: 42
    epochs: 3
    optimizer: AdamW
    learning_rate: 0.0001
    weight_decay: 0.01
    batch_size: 2
    num_workers: 2
    gradient_clip_norm: 1.0
    augmentations: []
    mixed_precision: false
    benchmark_windows_per_fold: 64
    runtime_projection_multiplier: 1.5
    runtime_projection_calibration:
      source_experiment: exp016_frozen_image_encoder
      parent_conservative_projected_seconds: 32359.33610285421
      parent_observed_notebook_seconds: 4620.864359417
      reserve_multiplier: 2.0
    runtime_gate_hours: 12.0
  control:
    source: exp016_frozen_image_encoder
    retrain: true
    reason: isolate_score_information_from_the_added_head_and_training_noise
    same_structure: true
    evaluate_same_outer_windows: true
  output:
    model_count: 4
    model_dir: models
    model_manifest: model_manifest.json
    training_summary: training_summary.json
    normalizer_manifest: detection_score_normalizers.json
  inference:
    implemented: false
    gate_source: validation.progression_gate
    submission_created: false

runtime:
  execution: cached_feature_tracker_train
  use_amp: false
  num_workers: 2
  batch_size: 2
  kaggle:
    enable_gpu: true
    enable_internet: false
    machine_shape: NvidiaTeslaT4
    time_limit_hours: 12
    include_experiment_sources: true
    dataset_sources:
      - pilkwang/biohub-tracking-support-pack-50ep-v1
    train:
      enable_gpu: true
      enable_internet: false
      machine_shape: NvidiaTeslaT4
      kernel_sources:
        - kentookumura/exp015-oracle-stage-limits-inference

reproducibility:
  deterministic_anchor: false
  seed: 42
  seed_policy: identical_fold_seed_and_dataloader_order_for_both_variants
  stochastic_components:
    - dataloader_shuffle
    - transformer_dropout
    - cuda_kernels
  parallel_rng_policy: >-
