  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;temporal-unet-full&quot; data-step=&quot;0&quot;&gt;
  &lt;style&gt;
    #temporal-unet-full { width: 100%; color: var(--foreground); }
    #temporal-unet-full h2 { margin-bottom: .45rem; }
    #temporal-unet-full .tuf-controls { margin-bottom: 1rem; }
    #temporal-unet-full .tuf-panel { display: none; }
    #temporal-unet-full[data-step=&quot;0&quot;] .tuf-step-0,
    #temporal-unet-full[data-step=&quot;1&quot;] .tuf-step-1,
    #temporal-unet-full[data-step=&quot;2&quot;] .tuf-step-2,
    #temporal-unet-full[data-step=&quot;3&quot;] .tuf-step-3 { display: block; }
    #temporal-unet-full h3 { margin-bottom: .8rem; }
    #temporal-unet-full strong { font-weight: 500; }
    #temporal-unet-full .tuf-muted { color: var(--muted-foreground); }
    #temporal-unet-full .tuf-row {
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: .6rem;
    }
    #temporal-unet-full .tuf-arrow { color: var(--muted-foreground); display: grid; place-items: center; }
    #temporal-unet-full .tuf-mark {
      display: grid; place-items: center; gap: .2rem; padding: .65rem;
      min-width: 6.5rem; min-height: 4rem; text-align: center;
      background: color-mix(in srgb, var(--muted) 42%, transparent);
    }
    #temporal-unet-full .tuf-mark-space { background: color-mix(in srgb, var(--viz-series-2) 14%, transparent); }
    #temporal-unet-full .tuf-mark-time { background: color-mix(in srgb, var(--viz-series-1) 14%, transparent); }
    #temporal-unet-full .tuf-mark-output { background: color-mix(in srgb, var(--viz-series-3) 14%, transparent); }
    #temporal-unet-full .tuf-axis-row {
      display: flex; justify-content: center; flex-wrap: wrap; gap: .55rem; margin-bottom: 1.1rem;
    }
    #temporal-unet-full .tuf-axis {
      display: grid; place-items: center; min-width: 3.4rem; min-height: 3.4rem; padding: .3rem;
      background: color-mix(in srgb, var(--viz-series-2) 14%, transparent);
    }
    #temporal-unet-full .tuf-axis-time { background: color-mix(in srgb, var(--viz-series-1) 14%, transparent); }
    #temporal-unet-full .tuf-axis-channel { background: color-mix(in srgb, var(--muted) 62%, transparent); }
    #temporal-unet-full .tuf-volume-pair {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;
    }
    #temporal-unet-full .tuf-volume-item {
      display: grid; grid-template-columns: minmax(8rem, 11rem) 1fr; align-items: center; gap: .7rem;
    }
    #temporal-unet-full .tuf-volume { width: 100%; overflow: visible; }
    #temporal-unet-full .tuf-slice {
      fill: color-mix(in srgb, var(--viz-series-2) 10%, transparent);
      stroke: var(--border); stroke-width: 1.5;
    }
    #temporal-unet-full .tuf-cell { fill: var(--viz-series-1); stroke: var(--foreground); stroke-width: 1; }
    #temporal-unet-full .tuf-downsample {
      display: grid; grid-template-columns: minmax(9rem, 1fr) auto minmax(9rem, 1fr); align-items: center;
      gap: .6rem; margin-top: 1rem;
    }
    #temporal-unet-full .tuf-model-flow {
      display: grid;
      grid-template-columns: minmax(7rem,1fr) auto minmax(7rem,1fr) auto minmax(12rem,1.55fr) auto minmax(10rem,1.2fr);
      align-items: stretch; gap: .5rem;
    }
    #temporal-unet-full .tuf-stage {
      display: grid; align-content: center; justify-items: center; gap: .45rem;
      min-height: 8.5rem; padding: .7rem; text-align: center;
      background: color-mix(in srgb, var(--muted) 40%, transparent);
    }
    #temporal-unet-full .tuf-encoder { background: color-mix(in srgb, var(--viz-series-2) 12%, transparent); }
    #temporal-unet-full .tuf-decoder { background: color-mix(in srgb, var(--viz-series-3) 12%, transparent); }
    #temporal-unet-full .tuf-stage-line {
      width: 100%; padding: .28rem; background: color-mix(in srgb, var(--background) 52%, transparent);
    }
    #temporal-unet-full .tuf-attn { background: color-mix(in srgb, var(--viz-series-1) 16%, transparent); }
    #temporal-unet-full .tuf-output-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; margin-top: 1rem;
    }
    #temporal-unet-full .tuf-branch-flow {
      display: grid;
      grid-template-columns: minmax(8rem,1fr) auto minmax(8rem,1fr) auto minmax(8rem,1fr);
      align-items: stretch; gap: .5rem; margin-bottom: .8rem;
    }
    #temporal-unet-full .tuf-merge {
      display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin: 1rem 0;
    }
    #temporal-unet-full .tuf-merge-lane {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: .45rem;
    }
    #temporal-unet-full .tuf-final-flow {
      display: grid; grid-template-columns: minmax(9rem,1fr) auto minmax(10rem,1.15fr) auto minmax(9rem,1fr);
      align-items: stretch; gap: .5rem;
    }
    #temporal-unet-full .tuf-compare {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem;
    }
    #temporal-unet-full .tuf-case { min-width: 0; }
    #temporal-unet-full .tuf-case-title {
      display: flex; align-items: center; justify-content: center; min-height: 2.8rem;
      margin-bottom: .6rem; background: color-mix(in srgb, var(--muted) 42%, transparent);
    }
    #temporal-unet-full .tuf-case-good .tuf-case-title {
      background: color-mix(in srgb, var(--viz-series-3) 14%, transparent);
    }
    #temporal-unet-full .tuf-case-flow {
      display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: stretch; gap: .35rem;
    }
    #temporal-unet-full .tuf-mini {
      display: grid; place-items: center; min-height: 7rem; padding: .55rem; text-align: center;
      background: color-mix(in srgb, var(--muted) 35%, transparent);
    }
    #temporal-unet-full .tuf-graph { width: 100%; max-width: 10rem; }
    #temporal-unet-full .tuf-graph text { fill: var(--foreground); }
    #temporal-unet-full .tuf-node { fill: var(--viz-series-1); stroke: var(--foreground); stroke-width: 1.5; }
    #temporal-unet-full .tuf-node-miss {
      fill: color-mix(in srgb, var(--red) 13%, transparent); stroke: var(--red); stroke-dasharray: 3 3;
    }
    #temporal-unet-full .tuf-edge { stroke: var(--viz-series-3); stroke-width: 4; }
    #temporal-unet-full .tuf-cross { stroke: var(--red); stroke-width: 3; }
    #temporal-unet-full .tuf-result { margin-top: 1rem; text-align: center; }
    @media (max-width: 760px) {
      #temporal-unet-full .tuf-model-flow,
      #temporal-unet-full .tuf-branch-flow,
      #temporal-unet-full .tuf-final-flow { grid-template-columns: 1fr; }
      #temporal-unet-full .tuf-model-flow &gt; .tuf-arrow,
      #temporal-unet-full .tuf-branch-flow &gt; .tuf-arrow,
      #temporal-unet-full .tuf-final-flow &gt; .tuf-arrow { min-height: 1.4rem; transform: rotate(90deg); }
      #temporal-unet-full .tuf-stage { min-height: 0; }
      #temporal-unet-full .tuf-compare { grid-template-columns: 1fr; }
      #temporal-unet-full .tuf-case-flow { grid-template-columns: 1fr; }
      #temporal-unet-full .tuf-case-flow &gt; .tuf-arrow { min-height: 1.4rem; transform: rotate(90deg); }
      #temporal-unet-full .tuf-mini { min-height: 0; }
    }
    @media (max-width: 520px) {
      #temporal-unet-full .tuf-volume-pair,
      #temporal-unet-full .tuf-output-grid,
      #temporal-unet-full .tuf-merge { grid-template-columns: 1fr; }
      #temporal-unet-full .tuf-volume-item { grid-template-columns: minmax(7rem,9rem) 1fr; }
      #temporal-unet-full .tuf-downsample { grid-template-columns: 1fr; }
      #temporal-unet-full .tuf-downsample &gt; .tuf-arrow { min-height: 1.4rem; transform: rotate(90deg); }
      #temporal-unet-full .tuf-merge-lane { grid-template-columns: 1fr; }
      #temporal-unet-full .tuf-merge-lane &gt; .tuf-arrow { min-height: 1.4rem; transform: rotate(90deg); }
    }
  &lt;/style&gt;

  &lt;h2&gt;TemporalUNet3D：3D画像からtrackingまで&lt;/h2&gt;
  &lt;div class=&quot;viz-controls tuf-controls&quot; role=&quot;group&quot; aria-label=&quot;解説する処理段階&quot;&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-tuf-step=&quot;0&quot; aria-pressed=&quot;true&quot;&gt;1 入力と3D座標&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-tuf-step=&quot;1&quot; aria-pressed=&quot;false&quot;&gt;2 モデル内部&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-tuf-step=&quot;2&quot; aria-pressed=&quot;false&quot;&gt;3 検出からtracking&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-tuf-step=&quot;3&quot; aria-pressed=&quot;false&quot;&gt;4 時間を見る理由&lt;/button&gt;

  &lt;section class=&quot;tuf-panel tuf-step-0&quot; aria-label=&quot;入力と3D座標&quot;&gt;

    &lt;div class=&quot;tuf-volume-pair&quot;&gt;

        &lt;svg class=&quot;tuf-volume&quot; viewBox=&quot;0 0 170 105&quot; role=&quot;img&quot; aria-label=&quot;時点tのZ sliceを重ねた3D volume&quot;&gt;
          &lt;rect class=&quot;tuf-slice&quot; x=&quot;12&quot; y=&quot;32&quot; width=&quot;112&quot; height=&quot;62&quot;&gt;&lt;/rect&gt;
          &lt;rect class=&quot;tuf-slice&quot; x=&quot;28&quot; y=&quot;19&quot; width=&quot;112&quot; height=&quot;62&quot;&gt;&lt;/rect&gt;
          &lt;rect class=&quot;tuf-slice&quot; x=&quot;44&quot; y=&quot;6&quot; width=&quot;112&quot; height=&quot;62&quot;&gt;&lt;/rect&gt;
          &lt;ellipse class=&quot;tuf-cell&quot; cx=&quot;91&quot; cy=&quot;47&quot; rx=&quot;12&quot; ry=&quot;9&quot;&gt;&lt;/ellipse&gt;
        &lt;/svg&gt;
        &lt;div&gt;&lt;strong&gt;時点 t&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;tuf-muted&quot;&gt;Z枚のY×X画像&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tuf-volume-item&quot;&gt;

          &lt;rect class=&quot;tuf-slice&quot; x=&quot;44&quot; y=&quot;6&quot; width=&quot;112&quot; height=&quot;62&quot;&gt;&lt;/rect&gt;

        &lt;div&gt;&lt;strong&gt;時点 t+1&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;tuf-muted&quot;&gt;次の3D volume&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;tuf-axis-row&quot; aria-label=&quot;モデル入力テンソルの軸&quot;&gt;
      &lt;div class=&quot;tuf-axis&quot;&gt;&lt;strong&gt;B&lt;/strong&gt;&lt;span class=&quot;tuf-muted&quot;&gt;batch&lt;/span&gt;&lt;/div&gt;

  &lt;section class=&quot;tuf-panel tuf-step-1&quot; aria-label=&quot;TemporalUNet3D内部&quot;&gt;
    &lt;h3&gt;2. TemporalUNet3D内部&lt;/h3&gt;
    &lt;div class=&quot;tuf-model-flow&quot;&gt;
      &lt;div class=&quot;tuf-stage&quot;&gt;
        &lt;strong&gt;入力&lt;/strong&gt;&lt;code&gt;(B,T,1,Z,Y,X)&lt;/code&gt;&lt;span class=&quot;tuf-muted&quot;&gt;T=2&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tuf-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;tuf-stage&quot;&gt;
        &lt;strong&gt;frame単位へ&lt;/strong&gt;&lt;code&gt;(B×T,1,Z,Y,X)&lt;/code&gt;&lt;span class=&quot;tuf-muted&quot;&gt;時間をZへ混ぜない&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tuf-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;tuf-stage tuf-encoder&quot;&gt;
        &lt;strong&gt;Encoder&lt;/strong&gt;
        &lt;div class=&quot;tuf-stage-line&quot;&gt;&lt;strong&gt;Conv3d 3×3×3&lt;/strong&gt; → 32 ch&lt;/div&gt;
        &lt;div class=&quot;tuf-stage-line&quot;&gt;MaxPool3d(2) → 64 ch&lt;/div&gt;
        &lt;div class=&quot;tuf-stage-line tuf-attn&quot;&gt;&lt;strong&gt;Temporal attention&lt;/strong&gt; across T&lt;/div&gt;
        &lt;div class=&quot;tuf-stage-line&quot;&gt;MaxPool3d(2) → 128 ch&lt;/div&gt;
        &lt;div class=&quot;tuf-stage-line tuf-attn&quot;&gt;&lt;strong&gt;Temporal attention&lt;/strong&gt; across T&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tuf-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;tuf-stage tuf-decoder&quot;&gt;
        &lt;strong&gt;Decoder&lt;/strong&gt;
        &lt;div class=&quot;tuf-stage-line&quot;&gt;trilinear upsample&lt;/div&gt;
        &lt;div class=&quot;tuf-stage-line&quot;&gt;&lt;strong&gt;skip connection&lt;/strong&gt; + Conv3d → 64 ch&lt;/div&gt;
        &lt;div class=&quot;tuf-stage-line&quot;&gt;upsample + skip → 32 ch&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tuf-output-grid&quot;&gt;
      &lt;div class=&quot;tuf-mark tuf-mark-output&quot;&gt;&lt;strong&gt;voxel特徴&lt;/strong&gt;&lt;code&gt;(B,T,32,Z,Y,X)&lt;/code&gt;&lt;span class=&quot;tuf-muted&quot;&gt;後段のnode特徴&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;tuf-mark tuf-mark-time&quot;&gt;&lt;strong&gt;1×1×1 detection head&lt;/strong&gt;&lt;code&gt;(B,T,1,Z,Y,X)&lt;/code&gt;&lt;span class=&quot;tuf-muted&quot;&gt;細胞中心logit&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tuf-result&quot;&gt;&lt;strong&gt;Conv3dはZ・Y・X、attentionだけがTを処理する&lt;/strong&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;tuf-panel tuf-step-2&quot; aria-label=&quot;細胞検出からtrackingまで&quot;&gt;
    &lt;h3&gt;3. 細胞検出からtrackingまで&lt;/h3&gt;
    &lt;div class=&quot;tuf-branch-flow&quot;&gt;
      &lt;div class=&quot;tuf-stage tuf-mark-time&quot;&gt;&lt;strong&gt;細胞中心logit&lt;/strong&gt;&lt;code&gt;(Z,Y,X)&lt;/code&gt;&lt;span class=&quot;tuf-muted&quot;&gt;各voxelのscore&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;tuf-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;tuf-stage&quot;&gt;&lt;strong&gt;3D局所最大値&lt;/strong&gt;&lt;span class=&quot;tuf-muted&quot;&gt;約5 µmでNMS&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;tuf-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;tuf-stage tuf-mark-output&quot;&gt;&lt;strong&gt;候補node&lt;/strong&gt;&lt;code&gt;(z,y,x)&lt;/code&gt;&lt;span class=&quot;tuf-muted&quot;&gt;細胞中心&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;tuf-merge&quot;&gt;
      &lt;div class=&quot;tuf-merge-lane&quot;&gt;
        &lt;div class=&quot;tuf-mark&quot;&gt;&lt;strong&gt;voxel特徴map&lt;/strong&gt;&lt;span class=&quot;tuf-muted&quot;&gt;32 channels&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;tuf-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
        &lt;div class=&quot;tuf-mark tuf-mark-space&quot;&gt;&lt;strong&gt;候補位置で取得&lt;/strong&gt;&lt;code&gt;F[z,y,x]&lt;/code&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tuf-merge-lane&quot;&gt;
        &lt;div class=&quot;tuf-mark&quot;&gt;&lt;strong&gt;明示的な座標&lt;/strong&gt;&lt;code&gt;(t,z,y,x)&lt;/code&gt;&lt;/div&gt;
        &lt;div class=&quot;tuf-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
        &lt;div class=&quot;tuf-mark tuf-mark-time&quot;&gt;&lt;strong&gt;位置embedding&lt;/strong&gt;&lt;span class=&quot;tuf-muted&quot;&gt;sin / cos&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;tuf-final-flow&quot;&gt;
      &lt;div class=&quot;tuf-stage&quot;&gt;&lt;strong&gt;特徴を結合&lt;/strong&gt;&lt;span class=&quot;tuf-muted&quot;&gt;voxel特徴 + 位置&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;tuf-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;tuf-stage tuf-mark-time&quot;&gt;&lt;strong&gt;Node transformer&lt;/strong&gt;&lt;span class=&quot;tuf-muted&quot;&gt;t と t+1 の全候補pair&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;tuf-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;tuf-stage tuf-mark-output&quot;&gt;&lt;strong&gt;edge確率&lt;/strong&gt;&lt;span class=&quot;tuf-muted&quot;&gt;同一細胞・分裂候補&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tuf-result&quot;&gt;&lt;strong&gt;3D U-Netはnode候補と特徴を作り、trackingはその後段&lt;/strong&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;tuf-panel tuf-step-3&quot; aria-label=&quot;物体検出時から時間を見る理由&quot;&gt;
    &lt;h3&gt;4. 物体検出時から時間を見る理由&lt;/h3&gt;
    &lt;div class=&quot;tuf-compare&quot;&gt;
      &lt;div class=&quot;tuf-case&quot;&gt;
        &lt;div class=&quot;tuf-case-title&quot;&gt;&lt;strong&gt;各frameを独立検出&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;tuf-case-flow&quot;&gt;
          &lt;div class=&quot;tuf-mini&quot;&gt;&lt;strong&gt;t&lt;/strong&gt;&lt;span class=&quot;tuf-muted&quot;&gt;暗く不鮮明&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;tuf-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
          &lt;div class=&quot;tuf-mini&quot;&gt;&lt;strong&gt;3D U-Net&lt;/strong&gt;&lt;span class=&quot;tuf-muted&quot;&gt;tだけを見る&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;tuf-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
          &lt;div class=&quot;tuf-mini&quot;&gt;
            &lt;svg class=&quot;tuf-graph&quot; viewBox=&quot;0 0 180 92&quot; role=&quot;img&quot; aria-label=&quot;tのnodeが欠け、t+1へedgeを作れない&quot;&gt;
              &lt;text x=&quot;26&quot; y=&quot;18&quot; text-anchor=&quot;middle&quot;&gt;t&lt;/text&gt;&lt;text x=&quot;154&quot; y=&quot;18&quot; text-anchor=&quot;middle&quot;&gt;t+1&lt;/text&gt;
              &lt;circle class=&quot;tuf-node tuf-node-miss&quot; cx=&quot;26&quot; cy=&quot;53&quot; r=&quot;16&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;tuf-node&quot; cx=&quot;154&quot; cy=&quot;53&quot; r=&quot;16&quot;&gt;&lt;/circle&gt;
              &lt;line class=&quot;tuf-cross&quot; x1=&quot;14&quot; y1=&quot;41&quot; x2=&quot;38&quot; y2=&quot;65&quot;&gt;&lt;/line&gt;&lt;line class=&quot;tuf-cross&quot; x1=&quot;38&quot; y1=&quot;41&quot; x2=&quot;14&quot; y2=&quot;65&quot;&gt;&lt;/line&gt;
            &lt;/svg&gt;
            &lt;span class=&quot;tuf-muted&quot;&gt;nodeなし → 接続不能&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;tuf-case tuf-case-good&quot;&gt;
        &lt;div class=&quot;tuf-case-title&quot;&gt;&lt;strong&gt;TemporalUNet3D&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;tuf-case-flow&quot;&gt;
          &lt;div class=&quot;tuf-mini&quot;&gt;&lt;strong&gt;t と t+1&lt;/strong&gt;&lt;span class=&quot;tuf-muted&quot;&gt;2 frameを同時に見る&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;tuf-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
          &lt;div class=&quot;tuf-mini&quot;&gt;&lt;strong&gt;3D Conv + attention&lt;/strong&gt;&lt;span class=&quot;tuf-muted&quot;&gt;次frameも手掛かり&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;tuf-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
          &lt;div class=&quot;tuf-mini&quot;&gt;
            &lt;svg class=&quot;tuf-graph&quot; viewBox=&quot;0 0 180 92&quot; role=&quot;img&quot; aria-label=&quot;両時点にnodeがありedgeを作れる&quot;&gt;
              &lt;text x=&quot;26&quot; y=&quot;18&quot; text-anchor=&quot;middle&quot;&gt;t&lt;/text&gt;&lt;text x=&quot;154&quot; y=&quot;18&quot; text-anchor=&quot;middle&quot;&gt;t+1&lt;/text&gt;
              &lt;line class=&quot;tuf-edge&quot; x1=&quot;43&quot; y1=&quot;53&quot; x2=&quot;137&quot; y2=&quot;53&quot;&gt;&lt;/line&gt;
              &lt;circle class=&quot;tuf-node&quot; cx=&quot;26&quot; cy=&quot;53&quot; r=&quot;16&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;tuf-node&quot; cx=&quot;154&quot; cy=&quot;53&quot; r=&quot;16&quot;&gt;&lt;/circle&gt;
            &lt;/svg&gt;
            &lt;span class=&quot;tuf-muted&quot;&gt;両方にnode → edge可能&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tuf-result&quot;&gt;&lt;strong&gt;後段trackerは、検出段階で存在しないnodeを原則として接続できない&lt;/strong&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;temporal-unet-full&#x27;);
      if (!root) return;
      const buttons = [...root.querySelectorAll(&#x27;[data-tuf-step]&#x27;)];
      function setStep(step) {
        root.dataset.step = step;
        buttons.forEach((button) =&gt; {
          const active = button.dataset.tufStep === step;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(active));
          button.classList.toggle(&#x27;btn-primary&#x27;, active);
        });
      }
      buttons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setStep(button.dataset.tufStep)));
      setStep(&#x27;0&#x27;);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
