competition:
  name: Biohub - Cell Tracking During Development
  platform: kaggle
  slug: biohub-cell-tracking-during-development
  url: https://www.kaggle.com/competitions/biohub-cell-tracking-during-development
  is_code_competition: true

paths:
  # Repository-relative paths used by automation. If these directories move,
  # move the files and update Markdown links and .gitignore in the same change.
  experiments_dir: experiments
  docs_dir: docs
  submissions_file: SUBMISSIONS.md

data:
  # Canonical repository-relative data paths. Keep train_dir and test_dir
  # inside raw_dir; processed_dir is the reusable derived-data location.
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  processed_dir: data/processed
  target_column: "GEFF nodes/props/{t,z,y,x}/values and edges/ids"
  group_column: embryo_id
  score_rows: all predicted node and edge rows for every test dataset

defaults:
  seed: 42
  metric: adjusted_edge_jaccard + 0.1 * division_jaccard
  primary_validation: embryo-disjoint grouped cross-validation
  n_folds: 5

submission:
  sample_file: data/raw/sample_submission.csv
  output_file: submission.csv
  id_column: id
  target_columns:
    - node_id
    - t
    - z
    - y
    - x
    - source_id
    - target_id
  allow_extra_columns: false

metadata:
  owner: kentookumura
  notes: Official metadata configured without downloading competition data on 2026-08-13.

runtime:
  kaggle:
    enable_gpu: false
    # Notebook package generation does not support TPU.
    enable_internet: false
    time_limit_hours: 12
